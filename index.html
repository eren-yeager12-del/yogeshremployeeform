<!DOCTYPE html>
<html>
    <head>
        <title>Employee Registration Form</title>
        <style>
            form{border: 2px;background-color: lightblue;
                 padding:10px ;
                  margin-top: 15px;
                margin-bottom: 15px; margin-left: 250px; margin-right:250px ;
             text-align: left;}
             body{background-color: aliceblue; text-align: center;
            }
            h1{border: 2px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; padding: 15px;background-color: green;
        color: white;}
            h3{font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; color:white; border: 2px; padding: 15px;background-color: brown}
            button{border: 7px; background-color: green;color: aliceblue; padding: 10px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; font-weight: 900;
        font-size: medium;}

        </style>
    </head>
    <body>

        <form autocomplete="on">
             <h1>Employee Registration Form</h1>
        <h2>Please fill this form to complete your registration. Thank You!</h2>
        <hr> 
            <h3>Personal information</h3>
            <label for="fname">First name:</label>
            <input type="text" id="fname" name="fname"><br><br>
             <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname"><br><br>
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select><br><br>
            <label for="status">Marital Status:</label>
            <select id="status" name="status">
                <option value="Married">Married</option>
                <option value="Unmarried">Unmarried</option>
            </select> 
            <label for="birth">Date of Birth:</label>
            <input type="date" id="birth" name="birth"><br><br>
        
        <h3>Contact Information</h3>
       
            <label for="email">Email Address:</label>
            <input type="text" id="email" name="email"><br><br>
            <label for="mobile">Mobile No.</label>
            <input type="number" id="mobile" name="mobile"><br><br>
        
        <h3>Residential Address</h3>
       
            <label for="street">Street Address:</label>
            <textarea id="street" name="street" rows="1" cols="50"></textarea><br><br>
            <label for="city">City:</label>
            <input type="text" id="city" name="city"><br><br>
            <label for="State">State/province:</label>
            <input type="text" id="state" name="state"><br><br>
            <label for="country">Country:</label>
            <input id="country" type="text" name="country"><br><br>
            <label for="pin">Pin Code:</label>
            <input type="number" id="pin" name="pin"><br><br><br>
            <button type="submit">Submit Your Form</button>
        </form>
</html>
